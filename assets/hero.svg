    <text x="698" y="122" fill="#64748b">{</text>
    <text x="713" y="143.5"><tspan fill="#a78bfa">"persona"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#34d399" dx="6">"Abdul Fatir Aziz"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="713" y="165"><tspan fill="#a78bfa">"role"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#34d399" dx="6">"GTM Engineer @ FullFunnel"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="713" y="186.5"><tspan fill="#a78bfa">"focus"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#34d399" dx="6">"AI-native revenue engines"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="713" y="208"><tspan fill="#a78bfa">"experience_years"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8" dx="6">6</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="713" y="229.5"><tspan fill="#a78bfa">"stack_depth"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#34d399" dx="6">"50+ tools"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="713" y="251"><tspan fill="#a78bfa">"agents_live"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8" dx="6">7</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="713" y="272.5"><tspan fill="#a78bfa">"status"</tspan><tspan fill="#64748b">:</tspan><tspan fill="#fbbf24" dx="6">"production_ready"</tspan></text>
    <text x="698" y="294" fill="#64748b">}</text>
