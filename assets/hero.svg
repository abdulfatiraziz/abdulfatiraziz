  <text x="68" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1.3" fill="#f8fafc">Abdul Fatir Aziz</text>

  <rect x="68" y="170" width="88" height="3" rx="1.5" fill="url(#ruleGrad)"/>

  <text x="68" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#cbd5e1">I build <tspan fill="url(#txtgrad)">GTM engines</tspan> that scale.</text>

  <text x="68" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#94a3b8">Architecting automated motions across inbound, outbound, paid, organic,</text>
  <text x="68" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#94a3b8">partnerships and events — with deep AI agent integration.</text>

