      <rect x="688" y="128.5" width="445" height="21" fill="#fff"><animate attributeName="width" from="0" to="445" dur="0.42s" begin="0.33s" fill="freeze"/></rect>
      <rect x="688" y="150" width="445" height="21" fill="#fff"><animate attributeName="width" from="0" to="445" dur="0.42s" begin="0.51s" fill="freeze"/></rect>
      <rect x="688" y="171.5" width="445" height="21" fill="#fff"><animate attributeName="width" from="0" to="445" dur="0.42s" begin="0.69s" fill="freeze"/></rect>
      <rect x="688" y="193" width="445" height="21" fill="#fff"><animate attributeName="width" from="0" to="445" dur="0.42s" begin="0.87s" fill="freeze"/></rect>
      <rect x="688" y="214.5" width="445" height="21" fill="#fff"><animate attributeName="width" from="0" to="445" dur="0.42s" begin="1.05s" fill="freeze"/></rect>
      <rect x="688" y="236" width="445" height="21" fill="#fff"><animate attributeName="width" from="0" to="445" dur="0.42s" begin="1.23s" fill="freeze"/></rect>
      <rect x="688" y="257.5" width="445" height="21" fill="#fff"><animate attributeName="width" from="0" to="445" dur="0.42s" begin="1.41s" fill="freeze"/></rect>
      <rect x="688" y="279" width="445" height="21" fill="#fff"><animate attributeName="width" from="0" to="445" dur="0.42s" begin="1.59s" fill="freeze"/></rect>
