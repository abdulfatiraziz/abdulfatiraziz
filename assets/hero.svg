  <text x="102" y="320" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#6ee7b7">Available for full-time / fractional</text>

  <rect x="648" y="58" width="488" height="284" rx="16" fill="#0f172a" fill-opacity="0.92" stroke="#7c3aed" stroke-opacity="0.22"/>
  <path d="M664 58 h456 a16 16 0 0 1 16 16 v22 h-488 v-22 a16 16 0 0 1 16 -16 z" fill="#ffffff" fill-opacity="0.03"/>
  <line x1="648" y1="96" x2="1136" y2="96" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle cx="676" cy="77" r="5.5" fill="#ff5f56"/>
  <circle cx="694" cy="77" r="5.5" fill="#ffbd2e"/>
