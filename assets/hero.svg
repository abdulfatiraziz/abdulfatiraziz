  <rect x="710" y="282" width="7.5" height="14" fill="#a78bfa" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <line x1="648" y1="306" x2="1136" y2="306" stroke="#ffffff" stroke-opacity="0.05"/>
  <text x="670" y="326" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#475569">JSON · UTF-8</text>
