<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Agent fleet: seven production GTM agents running in production">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#7c3aed"/>
      <stop offset="0.7" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipCard"><rect width="1200" height="250" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="250" rx="18" fill="#0f172a" stroke="#7c3aed" stroke-opacity="0.18"/>
  <g clip-path="url(#clipCard)"><rect width="1200" height="2.5" fill="url(#hair)"/></g>

  <circle cx="28" cy="38" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="42" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" letter-spacing="2.2" fill="#a78bfa">AGENT FLEET · 7 IN PRODUCTION</text>
  <text x="1172" y="42" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#475569">status: all_systems_live</text>
  <line x1="28" y1="62" x2="1172" y2="62" stroke="#ffffff" stroke-opacity="0.06"/>

  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#cbd5e1">

